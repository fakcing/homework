<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dogfight — Lab 01</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0f;
        overflow: hidden;
        color-scheme: dark;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: rgba(10, 10, 15, 0.92);
        color: #ff453a;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
      }
      #error.visible {
        display: grid;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Game arena"></canvas>
    <div id="error" role="alert"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
